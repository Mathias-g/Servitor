name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt -l reports unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Fetch Honker extension (pinned, ADR-0011)
        run: |
          set -euo pipefail
          mkdir -p /tmp/honker
          curl -sL -o /tmp/honker/ext.tgz \
            https://github.com/russellromney/honker/releases/download/ext-v0.5.0/honker-ext-linux-x64.tar.gz
          echo "4275604003e6c450277d9036b854af198462dfb0212ec6f0a0e72aeaf02e5507  /tmp/honker/ext.tgz" | sha256sum -c -
          (cd /tmp/honker && tar xzf ext.tgz)
          echo "HONKER_EXT_PATH=/tmp/honker/libhonker_ext.so" >> "$GITHUB_ENV"

      - name: Test
        run: go test ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.1

      - name: ADR front matter lint
        run: go run ./scripts/checks/adrlint
