repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'test -z "$(gofmt -l .)" || { echo "unformatted files:"; gofmt -l .; exit 1; }'
        language: system
        types: [go]
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        pass_filenames: false
      - id: adrlint
        name: ADR front matter lint
        entry: go run ./scripts/checks/adrlint
        language: system
        pass_filenames: false
